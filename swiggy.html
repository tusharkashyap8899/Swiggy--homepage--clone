<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Delivery & Grocery Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Header -->
    <header class="navbar">
        <div class="nav-container">
            <div class="location-picker">
                <span class="pin-icon">📍</span>
                <input type="text" placeholder="Enter your delivery location" />
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for restaurant, item or more" />
                <span class="search-icon">🔍</span>
            </div>
        </div>
    </header>

    <!-- Main Hero Promo Section -->
    <section class="hero-section">
        <div class="hero-container">
            
            <!-- Left Card: Food Delivery -->
            <div class="promo-card">
                <div class="card-info">
                    <h2>FOOD DELIVERY</h2>
                    <p class="subtitle">FROM RESTAURANTS</p>
                    <p class="discount">UPTO 60% OFF</p>
                    <button class="explore-btn">Explore <span class="arrow">→</span></button>
                </div>
                <div class="card-image">
                    <!-- Placeholder representing the food platter bowl -->
                    <div class="food-bowl-placeholder">🍛</div>
                </div>
            </div>

            <!-- Right Card: Instamart -->
            <div class="promo-card">
                <div class="card-info">
                    <h2>INSTAMART</h2>
                    <p class="subtitle">INSTANT GROCERY</p>
                    <p class="discount">UPTO 60% OFF</p>
                    <button class="explore-btn">Explore <span class="arrow">→</span></button>
                </div>
                <div class="card-image">
                    <!-- Placeholder representing the grocery basket -->
                    <div class="grocery-basket-placeholder">🧺</div>
                </div>
            </div>

        </div>
    </section>

    <!-- Bottom Category Grid Section -->
    <main class="food-options-section">
        <div class="section-header">
            <h3>Order our best food options</h3>
        </div>
        
        <div class="options-grid">
            <!-- Grid Item 1 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍲</span></div>
                <p>North Indian</p>
            </div>
            <!-- Grid Item 2 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍕</span></div>
                <p>Pizza</p>
            </div>
            <!-- Grid Item 3 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍔</span></div>
                <p>Burger</p>
            </div>
            <!-- Grid Item 4 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🧆</span></div>
                <p>Chole Bhature</p>
            </div>
            <!-- Grid Item 5 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍰</span></div>
                <p>Cake</p>
            </div>
            <!-- Grid Item 6 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍛</span></div>
                <p>Biryani</p>
            </div>
            <!-- Grid Item 7 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🥞</span></div>
                <p>Desserts</p>
            </div>
            <!-- Grid Item 8 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🍜</span></div>
                <p>Noodles</p>
            </div>
            <!-- Grid Item 9 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🇨🇳</span></div>
                <p>Chinese</p>
            </div>
            <!-- Grid Item 10 -->
            <div class="food-item">
                <div class="item-circle"><span class="food-emoji">🫓</span></div>
                <p>South Indian</p>
            </div>
        </div>
    </main>

</body>
</html>
